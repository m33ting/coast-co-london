
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coast & Co Loading Wheel</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F7F4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .loader-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Spinning loading wheel */
    .loader {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      border: 8px solid rgba(42, 42, 42, 0.1);
      border-top-color: #DCE6EF;
      border-right-color: #DCE6EF;

      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Coast & Co logo */
    .logo {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 103px;
      height: 103px;

      transform: translate(-50%, -50%);
      object-fit: contain;

      z-index: 2;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader-container">
         <table>
         <tr>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td> 
</tr>
  <tr>

             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
</tr>        
 <tr>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
             <td style="color:white; font-family:consolas"><img src="logo.png" width="300" height="300"alt="Coast & Co London Logo"></td>
</tr>

        </table>

</body>
</html>
