<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blankets & Throws — Coast & Co London</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --mist-blue: #DCE6EF;
      --salt-white: #F7F7F4;
      --driftwood: #D4C7B4;
      --charcoal: #2A2A2A;
      --mist-grey: #C7CCD4;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--salt-white);
      color: var(--charcoal);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* HEADER */
    header {
      padding: 1.8rem 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(244, 245, 247, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .header-logo {
      height: 60px;
      width: auto;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--charcoal);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    nav a.home-link {
      font-weight: bold;
    }

    /* DROPDOWN */
    .nav-dropdown {
      position: relative;
    }

    .nav-dropdown-menu {
      position: absolute;
      top: 120%;
      left: 0;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 0.6rem 0;
      min-width: 200px;
      display: none;
    }

    .nav-dropdown-menu a {
      display: block;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      text-transform: none;
      letter-spacing: 0.04em;
    }

    .nav-dropdown-menu a:hover {
      background: var(--mist-blue);
    }

    .nav-dropdown:hover .nav-dropdown-menu {
      display: block;
    }

    /* PAGE CONTENT */
    section {
      padding: 3.5rem 8%;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
      position: relative;
    }

    .card-logo {
      width: 80px;
      position: absolute;
      top: 1rem;
      right: 1rem;
      opacity: 0.15;
    }

    .card h3 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
    }

    /* FOOTER */
    footer {
      padding: 2rem 8%;
      font-size: 0.8rem;
      color: var(--charcoal);
      border-top: 1px solid rgba(42,42,42,0.12);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: #ffffff;
      align-items: center;
    }

    .footer-logo {
      height: 50px;
      width: auto;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <a href="index.html">
      <img src="logo.png" alt="Coast & Co London Logo" class="header-logo">
    </a>

    <nav>
      <a href="index.html" class="home-link">Home</a>

      <div class="nav-dropdown">
        <a href="collection.html">Collection</a>
        <div class="nav-dropdown-menu">
          <a href="candles.html">Candles</a>
          <a href="blankets-throws.html">Blankets/Throws</a>
          <a href="pillows.html">Pillows</a>
          <a href="soaps.html">Soaps</a>
          <a href="mugs.html">Mugs</a>
          <a href="table-runners.html">Table Runners</a>
          <a href="vases.html">Vases</a>
        </div>
      </div>

      <a href="our-story.html">Our Story</a>
    </nav>
  </header>

  <!-- CONTENT -->
  <section>
    <h1>Blankets & Throws</h1>

    <div class="grid">

      <div class="card">
        <img src="logo.png" class="card-logo" alt="">
        <h3>Mist Linen Throw</h3>
        <p>Stonewashed linen in driftwood tones, finished with a subtle Coast & Co label.</p>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <img src="logo.png" alt="Coast & Co London Logo" class="footer-logo">
    <div>© Coast & Co London</div>
    <div>Made in London, inspired by the coast.</div>
  </footer>

</body>
</html>
